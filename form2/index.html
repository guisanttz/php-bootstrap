<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <form class="container mt-5 w-75">
      <div class="container w-100">
        <div class="row mt-4 justify-content-between">
          <div class="col-md-1">
            <label for="" class="form-label">Código</label>
            <input type="text" value="32" class="form-control" />
          </div>
          <div class="col-md-4">
            <label for="" class="form-label">Nome</label>
            <input
              type="text"
              class="form-control"
              placeholder="Nome Completo do Cliente"
            />
          </div>
          <div class="col-md-4">
            <label for="" class="form-label">E-mail</label>
            <input
              type="text"
              class="form-control"
              placeholder="cliente@dominio.com"
            />
          </div>
          <div class="col-md-2">
            <label for="" class="form-label">CPF</label>
            <input type="text" class="form-control" placeholder="Só números" />
          </div>
        </div>

        <div class="row mt-4 justify-content-between">
          <div class="col-md-2">
            <label for="" class="form-label">Nº Celular</label>
            <input
              type="text"
              class="form-control"
              placeholder="Nº do celular"
            />
          </div>
          <div class="col-md-2">
            <label for="" class="form-label">Nº Telefone fixo</label>
            <input type="text" class="form-control" placeholder="Nº telefone" />
          </div>
          <div class="col-md-2">
            <label for="" class="form-label">CEP</label>
            <input type="text" class="form-control" placeholder="ex:88308070" />
          </div>
          <div class="col-md-2">
            <label for="" class="form-label">Logradouro</label>
            <input
              type="text"
              class="form-control"
              placeholder="ex:Rua 1400."
            />
          </div>
          <div class="col-md-1">
            <label for="" class="form-label">Nº</label>
            <input type="text" class="form-control" placeholder="Nº" />
          </div>
          <div class="col-md-2">
            <label for="" class="form-label">Bairro</label>
            <input type="text" class="form-control" placeholder="Bairro" />
          </div>
        </div>

        <div class="row mt-4">
          <div class="col-md-3">
            <label for="" class="form-label">Cidade</label>
            <input type="text" class="form-control" placeholder="Cidade" />
          </div>
          <div class="col-sm-1">
            <label for="" class="form-label">UF</label>
            <input type="text" class="form-control" placeholder="UF" />
          </div>
          <div class="col-md-2">
            <label class="form-label">Status</label>
            <select class="form-select" name="" id="">
              <option selected>Selecione</option>
              <option></option>
              <option></option>
              <option></option>
            </select>
          </div>
        </div>

        <div class="mt-3 row justify-content-end">
          <button class="col-md-1 m-1 btn btn-danger">Resetar</button>
          <button class="col-md-1 m-1 btn btn-success">Próximo</button>
        </div>
      </div>
    </form>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
